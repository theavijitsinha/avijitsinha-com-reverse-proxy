proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

log_format query_safe '$remote_addr [$time_local] '
                      '"$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent $request_time';

server {
    listen 8080;
    server_name avijitsinha.com;
    access_log /var/log/nginx/access.log query_safe;

    location ^~ /__/auth/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri.html =404;
    }

    location /music/training/ {
        proxy_pass https://music-training-553636919043.us-west1.run.app/music/training/;
    }

    location / {
        proxy_pass https://avijitsinha-com-553636919043.us-west1.run.app/;
    }
}

server {
    listen 8080;
    server_name beta.avijitsinha.com;
    access_log /var/log/nginx/access.log query_safe;

    location ^~ /__/auth/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri.html =404;
    }

    location /music/training/ {
        proxy_pass https://music-training-beta-553636919043.us-west1.run.app/music/training/;
    }

    location = /routine/dashboard {
        absolute_redirect off;
        return 308 /routine/dashboard/;
    }

    location = /routine/dashboard/internal {
        return 404;
    }

    location ^~ /routine/dashboard/internal/ {
        return 404;
    }

    location /routine/dashboard/ {
        proxy_pass https://routine-dashboard-beta-553636919043.us-west1.run.app/;
    }

    location = / {
        return 302 $scheme://$host/music/training/intervals/;
    }
}
