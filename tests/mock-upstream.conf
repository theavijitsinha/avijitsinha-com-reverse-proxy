server {
    listen 8081;
    server_name _;
    access_log off;

    location / {
        add_header X-Observed-Host $http_x_forwarded_host always;
        add_header X-Observed-Forwarded-Proto $http_x_forwarded_proto always;
        add_header X-Observed-Uri $request_uri always;
        add_header X-Observed-Cookie $http_cookie always;
        return 200 "fixture upstream\n";
    }
}
